<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eff6ff"/>
    </linearGradient>
    <linearGradient id="acGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="fridgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="washerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="tvGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7a18"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0a1e38" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="640" height="320" rx="16" fill="url(#skyGrad)"/>

  <!-- Floor / Ground Line -->
  <path d="M 30 270 L 610 270" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>

  <!-- ========================================== -->
  <!-- 1. AIR CONDITIONER (Top Center/Right)     -->
  <!-- ========================================== -->
  <g transform="translate(340, 36)" filter="url(#cardShadow)">
    <!-- AC Indoor Unit Body -->
    <rect width="240" height="68" rx="8" fill="url(#acGrad)" stroke="#94a3b8" stroke-width="2"/>
    <!-- Air Louvre Slot -->
    <rect x="16" y="50" width="208" height="8" rx="4" fill="#cbd5e1"/>
    <!-- Display Light & Brand Bar -->
    <circle cx="216" cy="24" r="4" fill="#22c55e"/>
    <rect x="24" y="20" width="36" height="5" rx="2" fill="#0284c7"/>
    <!-- Cooling Breeze Flow Lines -->
    <path d="M 60 76 Q 80 96 110 92" stroke="#38bdf8" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M 120 76 Q 140 102 170 96" stroke="#38bdf8" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M 180 76 Q 200 98 224 92" stroke="#38bdf8" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- ========================================== -->
  <!-- 2. REFRIGERATOR (Left Side)               -->
  <!-- ========================================== -->
  <g transform="translate(60, 60)" filter="url(#cardShadow)">
    <!-- Main Fridge Body -->
    <rect width="110" height="206" rx="8" fill="url(#fridgeGrad)" stroke="#94a3b8" stroke-width="2"/>
    <!-- Freezer Top Door -->
    <rect x="4" y="4" width="102" height="74" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="94" y="42" width="4" height="24" rx="2" fill="#64748b"/>
    <!-- Main Fresh Food Lower Door -->
    <rect x="4" y="82" width="102" height="118" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="94" y="98" width="4" height="34" rx="2" fill="#64748b"/>
    <!-- Digital Temp Display Indicator -->
    <rect x="42" y="32" width="26" height="12" rx="3" fill="#0f172a"/>
    <circle cx="49" cy="38" r="2" fill="#38bdf8"/>
    <circle cx="58" cy="38" r="2" fill="#22c55e"/>
  </g>

  <!-- ========================================== -->
  <!-- 3. WASHING MACHINE (Center)               -->
  <!-- ========================================== -->
  <g transform="translate(196, 120)" filter="url(#cardShadow)">
    <!-- Outer Washer Body -->
    <rect width="126" height="146" rx="8" fill="url(#washerGrad)" stroke="#94a3b8" stroke-width="2"/>
    <!-- Top Control Console -->
    <rect x="8" y="8" width="110" height="30" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <!-- Rotary Cycle Dial -->
    <circle cx="63" cy="23" r="8" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
    <circle cx="63" cy="23" r="3" fill="#0284c7"/>
    <!-- Detergent Drawer & LEDs -->
    <rect x="14" y="15" width="28" height="16" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <circle cx="94" cy="20" r="2.5" fill="#22c55e"/>
    <circle cx="102" cy="20" r="2.5" fill="#38bdf8"/>
    <!-- Circular Front Door Frame -->
    <circle cx="63" cy="88" r="44" fill="#0f172a" stroke="#cbd5e1" stroke-width="3"/>
    <circle cx="63" cy="88" r="35" fill="#1e293b"/>
    <!-- Inner Glass / Water Shine -->
    <circle cx="63" cy="88" r="26" fill="#0284c7" opacity="0.35"/>
    <path d="M 45 88 Q 63 104 81 88" stroke="#38bdf8" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>

  <!-- ========================================== -->
  <!-- 4. SMART TELEVISION (Right Center)        -->
  <!-- ========================================== -->
  <g transform="translate(350, 126)" filter="url(#cardShadow)">
    <!-- TV Outer Bezel Frame -->
    <rect width="210" height="124" rx="6" fill="#0f172a" stroke="#334155" stroke-width="2.5"/>
    <!-- Screen Glass -->
    <rect x="6" y="6" width="198" height="112" rx="3" fill="url(#tvGrad)"/>
    <!-- Display Graphics / Content Silhouette -->
    <path d="M 24 94 L 70 52 L 108 84 L 144 58 L 186 94 Z" fill="#0284c7" opacity="0.45"/>
    <circle cx="160" cy="38" r="10" fill="#f59e0b" opacity="0.8"/>
    <!-- Power Standby Dot -->
    <circle cx="105" cy="121" r="1.5" fill="#22c55e"/>
    <!-- Center Table Stand -->
    <path d="M 90 126 L 120 126 L 125 140 L 85 140 Z" fill="#475569"/>
  </g>

  <!-- ========================================== -->
  <!-- 5. Tiruppur SERVICE TRUST BADGE (Floating)   -->
  <!-- ========================================== -->
  <g transform="translate(480, 214)" filter="url(#cardShadow)">
    <!-- Shield / Seal Pill -->
    <rect width="138" height="48" rx="24" fill="url(#orangeGrad)"/>
    <!-- Service Wrench Icon inside Badge -->
    <circle cx="24" cy="24" r="16" fill="#ffffff"/>
    <path d="M 28 17 L 23 22 L 20 19 C 18 21 18 23 20 25 L 26 31 C 28 33 30 33 32 31 L 28 27 L 31 24 C 33 22 33 20 31 18 Z" fill="#ea580c"/>
    <!-- Text -->
    <text x="48" y="22" font-family="'Inter', sans-serif" font-size="10.5" font-weight="700" fill="#ffffff" letter-spacing="0.3">DOORSTEP</text>
    <text x="48" y="36" font-family="'Inter', sans-serif" font-size="9" font-weight="600" fill="#fed7aa">Tiruppur</text>
  </g>
</svg>